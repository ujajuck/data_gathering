[project]
name = "excel-canonical"
version = "0.1.0"
description = "단일 공정 반정형 Excel 통합·DB화 시스템"
requires-python = ">=3.10"
dependencies = [
    "openpyxl>=3.1",
    "PyYAML>=6.0",
    "Pillow>=10.0",       # openpyxl 이미지 추출에 필요
]

[project.optional-dependencies]
web = ["fastapi>=0.115", "uvicorn>=0.30", "pydantic>=2.7,<3"]   # 요청 계약은 Pydantic 2 API를 사용
test = ["pytest>=8.0", "httpx>=0.27", "pglast>=7"]   # pglast: PostgreSQL DDL 스크립트 구문 검증

[tool.setuptools]
packages = ["schema", "schema.render"]

[tool.pytest.ini_options]
testpaths = ["tests"]
