name: ci
on:
  push:
    branches: [main, master, dev, 'claude/**', 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install -e ".[web,test]"
      - name: Backend regression
        run: python -m pytest -q
      - name: Frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Component regression
        run: npm test
        working-directory: frontend
      - name: Production build
        run: npm run build
        working-directory: frontend
      - name: E2E dependencies
        run: npm ci
        working-directory: e2e
      - name: Chromium dependencies
        run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Browser workflow (main API + separate render server)
        run: npm test
        working-directory: e2e
      - name: Browser reports (synthetic documents only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-report
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
          retention-days: 7
