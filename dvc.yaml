# DVC — 현행(kg) 파이프라인 기준.
#
# 원본 버전닝은 시스템 중립이다: `dvc add data/raw` (미설치 환경은
# src/dvc_adapter의 sha256 fallback이 동일 인터페이스로 동작).
#
# 레거시 canonical 파이프라인(src.inspect → canonicalize)은 dvc.legacy.yaml로
# 이동 — 유지보수 모드이며 새 기능은 받지 않는다 (docs/MIGRATION.md).
vars:
  # v2_export_build 스테이지의 인자. 승인된 빌드 ID와 출력 폴더를 지정한 뒤 `dvc repro v2_export_build`.
  - v2_export:
      ws: domains/financier
      build_id: REPLACE_WITH_APPROVED_BUILD_ID
      out: exports/v2/REPLACE_WITH_APPROVED_BUILD_ID
stages:
  kg_ingest:
    # 원본/파서 코어/사전이 바뀌면 재실행. kg ingest는 파일 해시 기반
    # 멱등(무변경이면 스킵 + 매핑 승계)이라 반복 실행이 안전하다.
    # kg.db는 웹/CLI가 함께 쓰는 상태 저장소라 DVC outs로 잡지 않는다 —
    # 재현성은 문서 버전 해시·빌드 서명·lineage가 DB 안에서 담당한다.
    cmd: >-
      python -m kg.cli --ws domains/financier ingest
      --raw domains/financier/data/raw --map
    deps:
      - domains/financier/data/raw
      - domains/financier/config
      - kg
      - src/inspect
      - src/segment
      - src/mapping
      - src/units
      - src/common
  v2_export_build:
    # 승인된 v2 빌드 1건을 불변 snapshot(사용자 SQLite + manifest.json)으로 내보낸다.
    # 활성 data/kg/v2.db와 DRM 원본은 deps/outs에 두지 않는다(docs/design/db-schema-v2.md §10).
    # 파이프라인 없이 쓰려면: python -m kg.v2 export ... --out exports/v2/<id> && dvc add exports/v2/<id>
    cmd: python -m kg.v2 export --ws ${v2_export.ws} --build ${v2_export.build_id} --out ${v2_export.out}
    deps:
      - kg/v2
      - db/v2/schema_sqlite.sql
    outs:
      - ${v2_export.out}
