# DVC — 현행 kg/v2 파이프라인 + DVC 중심 최소 스키마 전환 기준.
#
# 신규 설계(db/dvc, docs/design/db-schema-dvc-minimal.md)의 원칙:
#   - 원본 Excel, 템플릿 정의, KG export/spec, 통합 산출물의 파일 이력은 Git/DVC가 담당한다.
#   - RDB는 안정 ID, 관계, 현재 매핑, 추출 실행/결과만 담당한다.
#   - document/template/KG revision 테이블을 DVC와 중복해서 만들지 않는다.
#
# 아래 kg_ingest / v2_export_build는 아직 기존 kg/v2 런타임용이다. 최소 스키마 런타임으로
# 전환되기 전까지 동작을 바꾸지 않는다. 즉 이 파일의 주석 변경은 기존 파이프라인의 입력/출력
# 계약을 깨지 않으며, 신규 구현의 책임 경계만 명확히 한다.
vars:
  # 기존 full-v2 export 경로. 승인된 빌드 ID와 출력 폴더를 지정한 뒤 `dvc repro v2_export_build`.
  - v2_export:
      ws: domains/financier
      build_id: REPLACE_WITH_APPROVED_BUILD_ID
      out: exports/v2/REPLACE_WITH_APPROVED_BUILD_ID
stages:
  kg_ingest:
    # 현행 kg ingest는 파일 해시 기반 멱등(무변경이면 스킵 + 매핑 승계)이다.
    # 신규 DVC-minimal 경로에서는 파일의 과거 revision 복원 책임을 DVC로 이동하고,
    # DB의 해시는 PK/버전 엔티티가 아니라 변경 감지 속성으로만 사용한다.
    cmd: >-
      python -m kg.cli --ws domains/financier ingest
      --raw domains/financier/data/raw --map
    deps:
      - domains/financier/data/raw
      - domains/financier/config
      - kg
      - src/inspect
      - src/segment
      - src/mapping
      - src/units
      - src/common
  v2_export_build:
    # 기존 32-table v2 런타임의 export stage. 비교/마이그레이션 기준으로 유지한다.
    # 신규 최소 스키마는 통합 산출물을 생성한 뒤 그 산출물 자체를 DVC로 추적하는 방향이다.
    cmd: python -m kg.v2 export --ws ${v2_export.ws} --build ${v2_export.build_id} --out ${v2_export.out}
    deps:
      - kg/v2
      - db/v2/schema_sqlite.sql
    outs:
      - ${v2_export.out}
