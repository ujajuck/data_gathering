csv_name: joined_data_dc
description: 조성평가 Data+DC 통합 — 전기+DC 특성
row_count: 480
categories:
  joined_experiment:
    name: 통합실험식별
    name_en: Joined Experiment Identity
    headers:
    - _source_file
    - exp_id
    - 구분
    - 모재/조성
    - 기종
    - lot
    concepts:
    - source_file
    - exp_id
    - category
    - base_composition
    - model
    - lot
  joined_firing:
    name: 소성조건
    name_en: Firing Conditions
    headers:
    - 소성Profile
    - 소성조건-2차가소
    - 소성조건-1차소성
    - 소성조건-본소성수소+keep
    - 소성조건-재산화+소성일자
    concepts:
    - firing_profile
    - firing_2nd_calcination
    - firing_1st
    - firing_hydrogen_keep
    - firing_reoxidation
  joined_electrical:
    name: 전기특성
    name_en: Electrical Properties
    headers:
    - Cp
    - DF
    - BDV AVG
    - BDV MIN
    - Cp STDEV
    - DF STDEV
    - BDV STDEV
    - Short
    - 일반조건
    - 특수조건
    - Cp/Df AVG
    - Cp/Df MIN
    - Cp/Df MAX
    concepts:
    - cp
    - df
    - bdv_avg
    - bdv_min
    - cp_stdev
    - df_stdev
    - bdv_stdev
    - short_rate
    - normal_condition
    - special_condition
    - cp_df_avg
    - cp_df_min
    - cp_df_max
  joined_dc:
    name: DC특성
    name_en: DC Properties
    headers:
    - DC_조성
    - 최종몰비
    - S/T
    - L/D
    - Layer
    - 1차소성
    - 수소농도
    - keep
    - 소성온도
    - 측정조건
    - 유지시간
    - DC전압
    - DC_Cp
    - DC_DF
    - ΔCp%
    - _match
    concepts:
    - dc_composition
    - final_mole_ratio
    - s_t_ratio
    - l_d_ratio
    - layer_count
    - 1st_calcination
    - hydrogen_concentration
    - keep_condition
    - firing_temperature
    - measurement_condition
    - hold_time
    - dc_voltage
    - dc_cp
    - dc_df
    - delta_cp_pct
    - match_type
