<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080">
  <defs>
    <style>
      .bg{fill:#f6f8fb}.panel{fill:#fff;stroke:#d8e0ea;stroke-width:1.2}.nav{fill:#f8fafc}.blue{fill:#2563eb}.blue2{fill:#dbeafe}.txt{font:14px Arial,sans-serif;fill:#233044}.small{font:12px Arial,sans-serif;fill:#64748b}.title{font:bold 22px Arial,sans-serif;fill:#111827}.h2{font:bold 17px Arial,sans-serif;fill:#111827}.bold{font:bold 13px Arial,sans-serif;fill:#233044}.line{stroke:#d7dee8;stroke-width:1}.g{fill:#e7f8ef;stroke:#43b77a}.p{fill:#f1e8ff;stroke:#8b5cf6}.o{fill:#fff1dc;stroke:#f59e0b}.r{fill:#ffe7ee;stroke:#f472b6}.node{rx:7;ry:7;stroke-width:1.1}.chip{fill:#eef2ff;stroke:#c7d2fe;rx:9;ry:9}.input{fill:#fff;stroke:#cbd5e1;rx:4;ry:4}.tableHead{fill:#f8fafc}.active{fill:#e8f0ff}.ok{fill:#dcfce7}.warn{fill:#fef3c7}.err{fill:#fee2e2}.muted{fill:#f1f5f9}.arrow{stroke:#94a3b8;stroke-width:1.5;fill:none}.rel{stroke:#a5b4fc;stroke-width:1.4;fill:none}.shadow{filter:url(#s)}
    </style>
    <filter id="s" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#94a3b8" flood-opacity=".18"/></filter>
