<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KG 뷰어</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --line: #e3e6ea; --ink: #1f2937;
    --sub: #6b7280; --accent: #2563eb; --accent-soft: #dbeafe;
    --hl: #fde047; --ok: #16a34a; --bad: #dc2626;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 13px/1.45 -apple-system, 'Malgun Gothic', sans-serif;
         color: var(--ink); background: var(--bg); height: 100vh;
         display: flex; flex-direction: column; }
  header { display: flex; gap: 10px; align-items: center; padding: 8px 14px;
           background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 14px; margin: 0 8px 0 0; }
  header input, header select { font: inherit; padding: 5px 8px;
           border: 1px solid var(--line); border-radius: 6px; min-width: 220px; }
  header .hint { color: var(--sub); font-size: 12px; }
  main { flex: 1; display: flex; min-height: 0; }
  #side { width: 360px; min-width: 300px; overflow-y: auto; padding: 10px;
          display: flex; flex-direction: column; gap: 10px; }
  .card { background: var(--panel); border: 1px solid var(--line);
          border-radius: 8px; padding: 10px; }
  .card h2 { font-size: 12px; margin: 0 0 6px; color: var(--sub);
             text-transform: none; letter-spacing: .02em; }
  .src { padding: 6px 8px; border-radius: 6px; cursor: pointer;
         display: flex; justify-content: space-between; gap: 8px; }
  .src:hover { background: var(--accent-soft); }
  .src.on { background: var(--accent-soft); outline: 1px solid var(--accent); }
  .src .h { font-weight: 600; }
  .src .m { color: var(--sub); font-size: 12px; white-space: nowrap; }
  .rev { border-top: 1px dashed var(--line); padding: 7px 2px; }
  .rev .h { font-weight: 600; cursor: pointer; }
  .rev .h:hover { color: var(--accent); }
  .rev .m { color: var(--sub); font-size: 12px; margin: 2px 0 5px; }
  .rev button { font: inherit; font-size: 12px; padding: 2px 10px; border-radius: 5px;
                border: 1px solid var(--line); background: #fff; cursor: pointer; }
  .rev button.ok { color: var(--ok); border-color: var(--ok); }
  .rev button.no { color: var(--bad); border-color: var(--bad); }
  #viewer { flex: 1; min-width: 0; display: flex; flex-direction: column;
            background: var(--panel); border-left: 1px solid var(--line); }
  #tabs { display: flex; gap: 2px; padding: 6px 10px 0; overflow-x: auto;
          border-bottom: 1px solid var(--line); flex: none; }
  #tabs button { font: inherit; font-size: 12px; border: 1px solid var(--line);
          border-bottom: none; background: var(--bg); padding: 4px 10px;
          border-radius: 6px 6px 0 0; cursor: pointer; white-space: nowrap; }
  #tabs button.on { background: var(--panel); font-weight: 700;
          border-color: var(--accent); color: var(--accent); }
  #gridwrap { flex: 1; overflow: auto; }
  table.grid { border-collapse: collapse; margin: 8px; }
  table.grid td { border: 1px solid #eceff3; padding: 2px 6px; min-width: 30px;
          max-width: 260px; overflow: hidden; text-overflow: ellipsis;
          white-space: nowrap; font-size: 12px; height: 20px; }
  table.grid td.hd { background: #fafbfc; color: var(--sub); font-size: 10px;
          text-align: center; min-width: 26px; position: sticky; }
  table.grid td.hl { outline: 2px solid var(--accent); background: var(--hl) !important; }
  #status { padding: 4px 12px; color: var(--sub); font-size: 12px;
            border-top: 1px solid var(--line); flex: none; }
  .empty { color: var(--sub); padding: 6px 2px; }
  #graph svg { width: 100%; height: auto; display: block; }
  #graph .gn { fill: #fff; stroke: var(--line); }
  #graph .gn.center { fill: var(--accent-soft); stroke: var(--accent); }
  #graph .gn.nb { cursor: pointer; }
  #graph .gn.nb:hover { stroke: var(--accent); }
  #graph text { font: 11px -apple-system, 'Malgun Gothic', sans-serif;
                fill: var(--ink); text-anchor: middle; pointer-events: none; }
  #graph text.rel { fill: var(--sub); font-size: 9.5px; }
  #graph text.cnt { fill: var(--sub); font-size: 9.5px; }
  #graph line { stroke: #c7ccd4; stroke-width: 1.2; }
</style>
</head>
<body>
<header>
  <h1>KG 뷰어</h1>
  <input id="q" list="concepts" placeholder="개념 검색 (예: 심부온도, core T)">
  <datalist id="concepts"></datalist>
  <select id="docsel"></select>
  <span class="hint" id="hint"></span>
</header>
<main>
  <div id="side">
    <div class="card" id="graphcard" style="display:none">
      <h2>지식 그래프 — 관계 이웃 (클릭하면 그 개념으로 이동)</h2>
      <div id="graph"></div>
    </div>
    <div class="card">
      <h2 id="srch2">개념을 검색하면 문서 횡단 소스가 나옵니다</h2>
      <div id="sources" style="max-height:340px;overflow-y:auto">
        <div class="empty">← 위 검색창에 개념 이름</div></div>
    </div>
    <div class="card">
      <h2>검수 대기 (REVIEW_REQUIRED)</h2>
      <div id="review"><div class="empty">불러오는 중…</div></div>
    </div>
  </div>
  <div id="viewer">
    <div id="tabs"></div>
    <div id="gridwrap"><div class="empty" style="padding:16px">문서를 선택하세요</div></div>
    <div id="status"></div>
  </div>
</main>
<script type="module" src="./app.js"></script>
</body>
</html>
